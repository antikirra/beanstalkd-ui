{{define "content"}}
<div class="topbar">
  <h1 class="page-title">Statistics Preference</h1>
</div>

<div class="page">
  <div class="card">
    <form method="POST" action="/statistics?action=save">
      <div class="card-body">
        <div class="form-group">
          <label class="form-label">
            Collection record number
            <span class="form-hint">(0 = disabled, recommended: 300)</span>
          </label>
          <input type="number" name="collection" class="form-input input-medium" min="0" required value="{{.StatsCollection}}">
        </div>
        <div class="form-group">
          <label class="form-label">
            Acquisition frequency (seconds)
            <span class="form-hint">(default: 300, minimum: 1)</span>
          </label>
          <input type="number" name="frequency" class="form-input input-medium" min="1" required value="{{.StatsFrequency}}">
        </div>
        <div class="form-group">
          <label class="form-label"><b>Monitor tubes</b></label>
          {{range $server, $tubes := .StatsTubes}}
          <div class="tube-group">
            <b>{{$server}}</b>
            <div class="tube-group-items">
              {{range $tube, $checked := $tubes}}
              <label class="checkbox-label">
                <input type="checkbox" name="tubes[{{$server}}:{{$tube}}]" value="1" {{if $checked}}checked{{end}}>
                {{$tube}}
              </label>
              {{end}}
            </div>
          </div>
          {{end}}
        </div>
      </div>
      <div class="card-footer">
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
{{end}}
