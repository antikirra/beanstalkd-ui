<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{if .PageTitle}}{{.PageTitle}} — {{end}}Beanstalkd UI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/idiomorph-ext.min.js" defer></script>
</head>
<body hx-ext="morph">
  <div id="progress-bar"></div>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="logo">
          <span class="logo-icon">B</span>
          Beanstalkd UI
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-item{{if or (eq .PagePath "/") (eq .PagePath "/server") (eq .PagePath "/tube")}} active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Servers
        </a>
        <a href="/sample?action=manageSamples" class="nav-item{{if eq .PagePath "/sample"}} active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Samples
        </a>
        <a href="/statistics?action=preference" class="nav-item{{if eq .PagePath "/statistics"}} active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Statistics
        </a>
        <hr class="sidebar-divider">
        <a href="/settings" class="nav-item{{if eq .PagePath "/settings"}} active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <span id="live-dot" class="live-dot"></span>
        <span>v{{printf "%.1f" .Version}}</span>
      </div>
    </aside>

    <main class="main">
      <div id="main">
        {{block "content" .}}{{end}}
      </div>
    </main>
  </div>

  <div id="toast-container" aria-live="polite">
    {{if .Flash}}
    <div class="toast toast-{{.Flash.Type}}">
      <span class="toast-icon">{{if eq .Flash.Type "success"}}✓{{else if eq .Flash.Type "error"}}✗{{else}}i{{end}}</span>
      <span>{{.Flash.Message}}</span>
    </div>
    {{end}}
  </div>

  <div id="modal-container"></div>

  <div class="modal" id="modal-confirm">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h3>Confirm action</h3>
        <button class="modal-close" data-action="confirmNo" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <p class="confirm-message"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-action="confirmNo">Cancel</button>
        <button class="btn btn-danger" data-action="confirmYes">Confirm</button>
      </div>
    </div>
  </div>
  <script src="/static/admin.js" defer></script>
</body>
</html>
