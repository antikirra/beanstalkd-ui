{{define "content"}}
<div class="topbar">
  <h1 class="page-title">Statistics — {{.StatsServer}} › {{.StatsTube}}</h1>
</div>

<div class="page">
  <div class="card">
    <div class="card-body">
      <div id="stats-chart"
           hx-get="/statistics?action=reloader&server={{.StatsServer}}&tube={{.StatsTube}}"
           hx-trigger="every 1s" hx-swap="innerHTML">
        <p class="text-muted">Loading…</p>
      </div>
      <div class="form-group mt-4">
        <label class="form-label">Update interval (seconds)</label>
        <input type="number" id="statsUpdateInterval" class="form-input input-medium" value="1" min="1">
      </div>
    </div>
  </div>
</div>
{{end}}

{{define "stats_table"}}
{{if .}}
<table class="table table-compact">
  <thead><tr><th>Field</th><th>Data points</th><th>Latest</th></tr></thead>
  <tbody>
    {{range .}}<tr><td><b>{{.Key}}</b></td><td>{{.Count}}</td><td>{{if .Latest}}{{.Latest}}{{else}}—{{end}}</td></tr>{{end}}
  </tbody>
</table>
{{else}}
<p class="text-muted">No data collected yet.</p>
{{end}}
{{end}}
