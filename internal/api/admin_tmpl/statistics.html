{{define "content"}}
<div class="topbar">
  <h1 class="page-title">Statistics — {{.StatsServer}} › {{.StatsTube}}</h1>
</div>

<div class="page">
  <div class="card">
    <div class="card-body">
      <div class="stats-chart" id="stats-chart"
           data-server="{{.StatsServer}}" data-tube="{{.StatsTube}}"></div>
      <div class="form-group mt-4">
        <label class="form-label">Update interval (seconds)</label>
        <input type="number" id="statsUpdateInterval" class="form-input input-medium" value="1" min="1">
      </div>
    </div>
  </div>
</div>
{{end}}
