{{define "content"}}
<div class="topbar">
  <h1 class="page-title">Manage Samples</h1>
  <div class="topbar-actions">
    <a href="/sample?action=newSample" class="btn btn-primary btn-sm">+ New sample</a>
  </div>
</div>

<div class="page">
  <div class="card">
    {{if .SampleJobs}}
    <table class="table">
      <thead><tr><th>Name</th><th>Tubes</th><th class="col-actions-lg">Actions</th></tr></thead>
      <tbody>
        {{range .SampleJobs}}
        <tr>
          <td><a href="/sample?action=editSample&key={{.Key}}">{{.Name}}</a></td>
          <td>{{range .Tubes}}<span class="badge badge-default">{{.}}</span> {{end}}</td>
          <td>
            <a href="/sample?action=editSample&key={{.Key}}" class="btn btn-ghost btn-xs">Edit</a>
            <form method="POST" action="/sample?action=deleteSample&key={{.Key}}" class="inline-form" data-confirm="Delete sample &lt;b&gt;{{.Name}}&lt;/b&gt;?">
              <button type="submit" class="btn btn-danger-outline btn-xs">Delete</button>
            </form>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
    {{else}}
    <div class="empty-state">
      No saved samples.
      <br><a href="/sample?action=newSample" class="btn btn-primary btn-sm mt-4">+ Create first sample</a>
    </div>
    {{end}}
  </div>
</div>
{{end}}
