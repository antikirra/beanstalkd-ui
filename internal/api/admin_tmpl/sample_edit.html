{{define "content"}}
<div class="topbar">
  <h1 class="page-title">
    <a href="/sample?action=manageSamples" class="breadcrumb-link"
       hx-get="/sample?action=manageSamples" hx-target="#main" hx-push-url="true">Samples</a>
    <span class="breadcrumb-sep">›</span>
    {{if .SampleJob}}Edit: {{.SampleJob.Name}}{{else}}New Sample{{end}}
  </h1>
</div>

<div class="page">
  <div class="card">
    <form method="POST" action="/sample?action={{if .SampleJob}}actionEditSample&key={{.SampleJob.Key}}{{else}}actionNewSample{{end}}">
      <div class="card-body">
        <div class="form-group">
          <label class="form-label">Name *</label>
          <input type="text" name="name" class="form-input" required
                 value="{{if .SampleJob}}{{.SampleJob.Name}}{{end}}" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">TTR * <small class="text-muted">(default: {{defaultTTR}})</small></label>
          <input type="number" name="ttr" class="form-input" required style="width:12em"
                 value="{{if .SampleJob}}{{.SampleJob.TTR}}{{else}}{{defaultTTR}}{{end}}">
        </div>
        <div class="form-group">
          <label class="form-label">Available on tubes *</label>
          {{range $server, $tubes := .ServerTubes}}
          {{if $tubes}}
          <div style="margin-bottom:12px">
            <b>{{$server}}</b>
            <div style="padding-left:16px; margin-top:4px">
              {{range $tubes}}
              <label class="checkbox-label">
                <input type="checkbox" name="tubes[{{.}}]" value="1"
                       {{if $.SampleJob}}{{if contains $.SampleJob.Tubes .}}checked{{end}}{{end}}>
                {{.}}
              </label>
              {{end}}
            </div>
          </div>
          {{end}}
          {{end}}
        </div>
        <div class="form-group">
          <label class="form-label">Job data *</label>
          <textarea name="jobdata" class="form-input" required rows="5">{{if .SampleJob}}{{.SampleJob.Data}}{{end}}</textarea>
        </div>
      </div>
      <div class="card-footer">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/sample?action=manageSamples" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{{end}}
